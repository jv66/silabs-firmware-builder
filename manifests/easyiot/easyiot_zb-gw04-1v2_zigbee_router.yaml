name: easyiot ZB-GW04-1v2 Zigbee Router
device: EFR32MG21A020F768IM32
base_project: src/zigbee_router
filename: "{manifest_name}_{sdk_version}_{fw_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1"

gbl:
  fw_type: zigbee_router
  baudrate: 115200
  fw_variant: hw_flow

add_components:
  # BOOT
  - id: simple_button
    instance:
      - btn1

c_defines:
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 115200
  # v1.2 wires CTS/RTS to the CH340 (that is the whole point of the v1.2 revision).
  # With no flow control the EFR32's RTS pin is left undriven, the CH340's CTS input
  # never sees "clear to send", and the CH340 stops forwarding host->device bytes:
  # the app prints on the CLI but never receives any input (and --bootloader-reset
  # rts_dtr/baudrate can never work). Mirror the NCP config instead.
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlCtsAndRts

  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0

  SL_IOSTREAM_USART_VCOM_TX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_TX_PIN: 1

  SL_IOSTREAM_USART_VCOM_RX_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_USART_VCOM_RX_PIN: 0

  SL_IOSTREAM_USART_VCOM_CTS_PORT: SL_GPIO_PORT_D
  SL_IOSTREAM_USART_VCOM_CTS_PIN: 3

  SL_IOSTREAM_USART_VCOM_RTS_PORT: SL_GPIO_PORT_D
  SL_IOSTREAM_USART_VCOM_RTS_PIN: 4

  SL_SIMPLE_BUTTON_BTN1_MODE: SL_SIMPLE_BUTTON_MODE_INTERRUPT
  SL_SIMPLE_BUTTON_BTN1_PORT: SL_GPIO_PORT_A
  SL_SIMPLE_BUTTON_BTN1_PIN: 0

  SL_CLOCK_MANAGER_HFXO_CTUNE: 128

  SL_RAIL_UTIL_RSSI_OFFSET: -11
